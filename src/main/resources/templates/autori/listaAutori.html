<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista Autori - SiwMangaTalk</title>
    <link rel="stylesheet" th:href="@{/css/listaAutori.css}">
</head>
<body>

    <div class="top-nav-absolute">
        <a th:href="@{/}">
            <img th:src="@{/images/logo_siwmangatalk.png}" alt="SiwMangaTalk Logo" class="site-logo">
        </a>
        <span th:if="${userDetails}"
              style="position:fixed;top:18px;right:24px;color:#fff;font-weight:600;font-size:0.95rem;z-index:100;"
              th:text="'Bentornato ' + ${userDetails.username} + '!'"></span>
    </div>

    <main class="main-content">
        
        <h1 class="page-title">I Maestri del Manga</h1>
        
        <div class="authors-grid">
            <a class="author-card" th:each="autore : ${autori}" th:href="@{'/autori/' + ${autore.id}}">
                <span class="author-icon">✒️</span> <span class="author-name" th:text="${autore.nome} + ' ' + ${autore.cognome}">Nome Autore</span>
            </a>
        </div>

        <div class="navigation-links">
            <a class="btn-nav" th:href="@{/}">Torna alla home</a>
        </div>

    </main>
	
</body>
</html>
