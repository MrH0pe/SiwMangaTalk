<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista Autori</title>
</head>
<body>
    <h1> Lista Autori </h1>
    <div>
        <ul>
            <li th:each="autore : ${autori}"> 
                <a th:href="@{'/autori/' + ${autore.id}}" 
                   th:text="${autore.nome} + ' ' + ${autore.cognome}">Luca Bianchi</a>
            </li>
        </ul>
    </div>
	
	
	
	<p><a th:href="@{/}">Torna alla home</a></p>
	
	
	
</body>
</html>
