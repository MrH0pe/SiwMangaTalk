<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${autore.nome} + ' ' + ${autore.cognome} + ' - SiwMangaTalk'">Dettaglio Autore</title>
    <link rel="stylesheet" th:href="@{/css/dettaglioAutore.css}">
</head>
<body>

    <div class="top-nav-absolute">
        <a th:href="@{/}">
            <img th:src="@{/images/logo_siwmangatalk.png}" alt="SiwMangaTalk Logo" class="site-logo">
        </a>
        <span th:if="${userDetails}"
              style="position:fixed;top:18px;right:24px;color:#fff;font-weight:600;font-size:0.95rem;z-index:100;"
              th:text="'Bentornato ' + ${userDetails.username} + '!'"></span>
    </div>

    <main class="main-content">
        
        <div class="author-header">
            <h1 th:text="${autore.nome} + ' ' + ${autore.cognome}">Nome Cognome Autore</h1>
        </div>
        
        <section class="info-card">
            <h2>Biografia e Dettagli</h2>
            
            <div class="descrizione-box">
                <strong>Descrizione:</strong> 
                <p class="descrizione" th:text="${autore.descrizione}">Descrizione non disponibile</p>
            </div>

            <div class="manga-collegato-box" th:if="${autore.manga != null}">
                <strong>Opera principale:</strong> 
                <a th:href="@{'/mangas/' + ${autore.manga.id}}" th:text="${autore.manga.nome}">Nome Manga</a>
            </div>
        </section>

        <div class="navigation-links">
            <a class="btn-nav" th:href="@{/autori}">Torna alla lista autori</a>
            <a class="btn-nav" th:href="@{/}">Torna alla home</a>
        </div>

    </main>

</body>
</html>
