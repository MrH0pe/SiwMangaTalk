<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- @{} è un URL, ${} è un dato -->
<head>
    <title>SIW Manga Talk</title>
    <link rel="stylesheet" th:href="@{/css/home.css}">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="top-nav">
        <a th:href="@{/}">
            <img th:src="@{/images/logo_siwmangatalk.png}" alt="SiwMangaTalk Logo" class="site-logo">
        </a>
        <span th:if="${userDetails}" class="user-greeting"
              th:text="'Bentornato ' + ${userDetails.username} + '!'"></span>
    </nav>

    <!-- HERO -->
    <section class="hero">

        <h1 class="hero-title">SIW Manga Talk</h1>
        <p class="hero-subtitle">Il tuo spazio per scoprire e commentare i migliori manga</p>

        <!-- CARD NAVIGAZIONE PRINCIPALI -->
        <div class="nav-grid">

            <a th:href="@{/mangas}" class="nav-card">
                <span class="nav-card-icon">📚</span>
                <span class="nav-card-label">Lista Manga</span>
            </a>

            <a th:href="@{/autori}" class="nav-card">
                <span class="nav-card-icon">✒️</span>
                <span class="nav-card-label">Lista Mangaka</span>
            </a>

            <a th:if="${userDetails}" th:href="@{/mieiCommenti}" class="nav-card">
                <span class="nav-card-icon">💬</span>
                <span class="nav-card-label">I miei Commenti</span>
            </a>

        </div>

        <!-- SEZIONE LOGIN / LOGOUT -->
        <div class="auth-section">

            <a th:if="${userDetails == null}" th:href="@{/login}" class="btn-auth btn-login">Accedi</a>
            <a th:if="${userDetails == null}" th:href="@{/register}" class="btn-auth btn-logout">Registrati</a>

            <form th:if="${userDetails}" th:action="@{/logout}" method="post" style="margin:0;">
                <button type="submit" class="btn-auth btn-logout">Logout</button>
            </form>

        </div>

    </section>

    <footer>
        <p>&copy; 2026 SiwMangaTalk</p>
    </footer>

</body>

</html>
