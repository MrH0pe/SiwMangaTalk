<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Registrazione - SIW Manga Talk</title>
</head>

<body>

    <h1>SIW MANGA TALK</h1>

    <h2>Crea un account</h2>

    <form th:action="@{/register}" method="post">

        <h3>Dati personali</h3>

        <div>
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name" th:value="${user.name}" required />
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" th:value="${user.email}" required />
        </div>

        <h3>Credenziali</h3>

        <div>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" th:value="${credentials.username}" required />
        </div>

        <div>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required />
        </div>

        <div th:if="${userError}">
            <p th:text="${userError}" style="color:red;"></p>
        </div>

        <div>
            <button type="submit">Registrati</button>
        </div>

    </form>

    <p>Hai già un account? <a th:href="@{/login}">Accedi</a></p>

    <p><a th:href="@{/}">Torna alla home</a></p>

</body>

</html>
