<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Registrazione - SIW Manga Talk</title>
    <link rel="stylesheet" th:href="@{/css/authentication.css}">
</head>

<body>

    <!-- LOGO IN ALTO A SINISTRA -->
    <div class="top-nav-absolute">
        <a th:href="@{/}">
            <img th:src="@{/images/logo_siwmangatalk.png}" alt="SiwMangaTalk Logo" class="site-logo">
        </a>
    </div>

    <main class="auth-main">
        <div class="auth-card">

            <h2 class="auth-title">Crea un account</h2>

            <!-- Form per effettuare la registrazione -->
            <form th:action="@{/register}" method="post" class="auth-form">

                <p class="form-section-title">Dati personali</p>

                <!-- th:object seleziona l'oggetto del model a cui #fields fa riferimento:
                     gli errori di validazione (BindingResult) vengono letti da lì -->
                <div class="form-group" th:object="${user}">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" th:value="${user.name}" required />
                    <span class="error-msg" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                </div>

                <div class="form-group" th:object="${user}">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" th:value="${user.email}" required />
                    <span class="error-msg" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>

                <p class="form-section-title">Credenziali</p>

                <div class="form-group" th:object="${credentials}">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" th:value="${credentials.username}" required />
                    <span class="error-msg" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required />
                        <button type="button" class="btn-toggle-password" onclick="togglePassword('password', this)" aria-label="Mostra/nascondi password">
                            <!-- Occhio aperto: password nascosta -->
                            <svg class="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                                <circle cx="12" cy="12" r="3"/>
                            </svg>
                            <!-- Occhio barrato: password visibile -->
                            <svg class="eye-off-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                                <line x1="1" y1="1" x2="23" y2="23"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Registrati</button>

            </form>

            <div class="auth-links">
                <p>Hai già un account? <a th:href="@{/login}">Accedi</a></p>
                <p><a th:href="@{/}">Torna alla home</a></p>
            </div>

        </div>
    </main>


<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const eyeIcon = btn.querySelector('.eye-icon');
        const eyeOffIcon = btn.querySelector('.eye-off-icon');
        if (input.type === 'password') {
            input.type = 'text';
            eyeIcon.style.display = 'none';
            eyeOffIcon.style.display = 'block';
        } else {
            input.type = 'password';
            eyeIcon.style.display = 'block';
            eyeOffIcon.style.display = 'none';
        }
    }
</script>

</body>

</html>
