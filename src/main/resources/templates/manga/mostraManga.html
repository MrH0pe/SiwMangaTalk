<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<title th:text="${manga.nome} + ' - SiwMangaTalk'">Dettaglio Manga</title>
    <link rel="stylesheet" th:href="@{/css/dettaglioManga.css}">
</head>
<body>

    <div class="top-nav-absolute">
        <a th:href="@{/}">
            <img th:src="@{/images/logo_siwmangatalk.png}" alt="SiwMangaTalk Logo" class="site-logo">
        </a>
        <span th:if="${userDetails}"
              style="position:fixed;top:18px;right:24px;color:#fff;font-weight:600;font-size:0.95rem;z-index:100;"
              th:text="'Bentornato ' + ${userDetails.username} + '!'"></span>
    </div>

    <header class="hero-section" th:style="'background-image: url(' + @{${manga.pathSfondo}} + ')'">
        <div class="hero-overlay"></div>
        
        <div class="hero-content">
            <img class="manga-cover" th:src="@{${manga.pathImmagine}}" th:alt="${manga.nome}" referrerpolicy="no-referrer" />
            <h1 class="manga-title" th:text="${manga.nome}">Nome Manga</h1>
        </div>
    </header>

    <main class="main-content">
        
        <section class="info-card">
            <h2>Trama</h2>
            <p class="descrizione" th:text="${manga.descrizione}">Questo è un bel manga!</p>
            
            <div class="autore-box">
                <strong>Autore:</strong> 
                <a th:if="${manga.autore != null}" 
                   th:href="@{'/autori/' + ${manga.autore.id}}"
                   th:text="${manga.autore.nome} + ' ' + ${manga.autore.cognome}">Nome Autore
                </a>
                <span th:if="${manga.autore == null}">Nessun autore assegnato</span>
            </div>
        </section>

		<!-- Form per Inserire commenti dentro un manga -->
        <section class="comments-section">
            <h2>Commenti della Community</h2>
            
			<div class="add-comment-box">
			    <!-- L'azione punta all'URL con l'ID del manga dinamico -->
			    <form method="POST" th:action="@{'/manga/' + ${manga.id} + '/commenti'}" th:object="${commento}">
			        
			        <div th:if="${#fields.hasGlobalErrors()}">
			            <p th:each="err : ${#fields.globalErrors()}" th:text="${err}" style="color: red;"></p>
			        </div>

			        <div>
			            <!-- Meglio una textarea per i commenti rispetto a un input text -->
			            <textarea th:field="*{testo}" rows="3" placeholder="Scrivi cosa ne pensi..." required></textarea>
			            <span th:if="${#fields.hasErrors('testo')}" th:errors="*{testo}" style="color: red;"></span>
			        </div>

			        <div>
			            <button type="submit" class="btn-nav">Pubblica Commento</button>
			        </div>
			    </form>
			</div>

            <div class="comment-list">
                <div th:if="${#lists.isEmpty(commenti)}">
                    <p>Nessun commento ancora. Sii il primo!</p>
                </div>
                <div class="comment-item" th:each="c : ${commenti}">
                    <strong th:text="${c.utente != null ? c.utente.username : 'Anonimo'}"></strong>
                    <p th:text="${c.testo}"></p>
                    <small th:text="${#temporals.format(c.tempoPubblicazione, 'dd/MM/yyyy HH:mm')}"></small>
                </div>
            </div>
        </section>

        <div class="navigation-links">
            <a class="btn-nav" th:href="@{/mangas}">Torna alla lista</a>
            <a class="btn-nav" th:href="@{/}">Torna alla home</a>
        </div>

    </main>

</body>
</html>
